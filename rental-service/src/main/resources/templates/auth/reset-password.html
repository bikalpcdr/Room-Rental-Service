<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Rental Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo {
            font-size: 2.5rem;
            color: #0d6efd;
            margin-bottom: 20px;
        }
        .form-floating {
            margin-bottom: 15px;
        }
        .btn-auth {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
        }
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        .auth-links a {
            color: #0d6efd;
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-home"></i>
                </div>
                <h2>Reset Password</h2>
                <p class="text-muted">Enter your new password</p>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Success Message -->
            <div th:if="${success}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/auth/reset-password}" method="post" th:object="${resetPasswordRequest}">
                <input type="hidden" name="token" th:value="${token}">
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" 
                           th:field="*{password}" placeholder="New Password" required>
                    <label for="password">New Password</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" 
                         th:errors="*{password}"></div>
                    <div class="password-requirements">
                        Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one number, and one special character.
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                           th:field="*{confirmPassword}" placeholder="Confirm New Password" required>
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" 
                         th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-auth">
                    <i class="fas fa-key"></i> Reset Password
                </button>
            </form>

            <div class="auth-links">
                <p>
                    Remember your password? <a th:href="@{/auth/login}">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
