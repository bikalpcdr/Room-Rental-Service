<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${room.id == null ? 'Create Room' : 'Edit Room'}">Room Form - Rental Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
        }
        .sidebar .nav-link:hover {
            color: #fff;
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .logout-form {
            display: inline;
        }
        .logout-button {
            background: none;
            border: none;
            color: rgba(255,255,255,.75);
            padding: 0;
            margin: 0;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .logout-button:hover {
            color: #fff;
        }
        #imagePreview .card {
            margin-bottom: 10px;
        }
        #imagePreview img {
            border-radius: 5px;
        }
        #imagePreview .btn-danger {
            padding: 0.25rem 0.5rem;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(220, 53, 69, 0.8);
            border: none;
        }
        #imagePreview .btn-danger:hover {
            background-color: rgba(220, 53, 69, 1);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">Landlord Dashboard</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/landlord/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#" th:href="@{/landlord/rooms}">
                                <i class="bi bi-house-door me-2"></i>
                                Rooms
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/landlord/bookings}">
                                <i class="bi bi-calendar-check me-2"></i>
                                Bookings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/landlord/profile}">
                                <i class="bi bi-person me-2"></i>
                                Profile
                            </a>
                        </li>
                        <li class="nav-item">
                            <form class="logout-form" th:action="@{/auth/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="nav-link logout-button">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" th:text="${room.id == null ? 'Create New Room' : 'Edit Room'}">Room Form</h1>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form th:action="@{${room.id == null ? '/landlord/rooms/create' : '/landlord/rooms/' + room.id + '/edit'}}"
                              method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title" 
                                       th:value="${room.title}" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" 
                                          rows="4" required th:text="${room.description}"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="pricePerMonth" class="form-label">Price per Month</label>
                                        <div class="input-group">
                                            <span class="input-group-text">NPR</span>
                                            <input type="number" class="form-control" id="pricePerMonth" 
                                                   name="pricePerMonth" step="0.01" min="0" required
                                                   th:value="${room.pricePerMonth}">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="roomType" class="form-label">Room Type</label>
                                        <select class="form-select" id="roomType" name="roomType" required>
                                            <option value="" disabled selected th:if="${room.roomType == null}">Select Room Type</option>
                                            <option th:each="type : ${roomTypes}"
                                                    th:value="${type}"
                                                    th:text="${#strings.capitalize(#strings.replace(type.name(), '_', ' '))}"
                                                    th:selected="${room.roomType == type}">
                                            </option>
                                        </select>
                                    </div>
                                </div>                                
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="numberOfRooms" class="form-label">Number of Rooms</label>
                                        <input type="number" class="form-control" id="numberOfRooms" 
                                               name="numberOfRooms" min="1" required
                                               th:value="${room.numberOfRooms}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="capacity" class="form-label">Capacity</label>
                                        <input type="number" class="form-control" id="capacity" 
                                               name="capacity" min="1" required
                                               th:value="${room.capacity}">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" name="address" 
                                       th:value="${room.address}" required>
                            </div>

                            <div class="mb-3">
                                <label for="amenities" class="form-label">Amenities (comma-separated)</label>
                                <input type="text" class="form-control" id="amenities" name="amenities" 
                                       th:value="${room.amenities}">
                                <div class="form-text">Example: WiFi, Parking, Air Conditioning, etc.</div>
                            </div>

                            <div class="mb-3">
                                <label for="images" class="form-label">Room Images</label>
                                <input type="file" class="form-control" id="images" name="images" multiple accept="image/*"
                                       th:required="${room.id == null}"
                                       onchange="previewImages(this)">
                                <div class="form-text">You can select multiple images. The first image will be set as the primary image.</div>

                                <!-- Image preview container -->
                                <div id="imagePreview" class="mt-3">
                                    <div class="row g-2" id="previewContainer">
                                        <!-- Existing images -->
                                        <div class="col-md-3" th:each="image, stat : ${room.roomImages}" data-image-id="[[${image.id}]]">
                                            <div class="card position-relative">
                                                <img th:src="'data:image/jpeg;base64,' + ${image.imageData}"
                                                     class="card-img-top" style="height: 150px; object-fit: cover;">
                                                <button type="button" class="btn btn-danger btn-sm position-absolute"
                                                        style="top: 5px; right: 5px; z-index: 1;"
                                                        onclick="removeExistingImage('[[${image.id}]]')">
                                                    <i class="bi bi-x-lg"></i>
                                                </button>
                                                <div class="card-body p-2">
                                                    <small class="text-muted">Existing Image</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="available" 
                                       name="available" th:checked="${room.available}">
                                <label class="form-check-label" for="available">Available for Booking</label>
                            </div>

                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${room.id == null ? 'Create Room' : 'Update Room'}">Save</span>
                                </button>
                                <a href="#" th:href="@{/landlord/rooms}" class="btn btn-secondary">
                                    <i class="bi bi-x-lg me-1"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let existingImagesArray = [];
        let removedImages = new Set();
        let selectedFilesList = [];

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('#existingImagesData > div').forEach(div => {
                existingImagesArray.push({
                    id: String(div.getAttribute('data-id')),
                    src: div.getAttribute('data-src')
                });
            });
        });

        function previewImages(input) {
            const previewContainer = document.getElementById('previewContainer');
            // Accumulate files instead of replacing
            for (let i = 0; i < input.files.length; i++) {
                selectedFilesList.push(input.files[i]);
            }
            previewContainer.innerHTML = '';

            // Render all existing images not in removedImages
            existingImagesArray.forEach(img => {
                if (!removedImages.has(String(img.id))) {
                    const col = document.createElement('div');
                    col.className = 'col-md-3';
                    col.setAttribute('data-image-id', img.id);

                    const card = document.createElement('div');
                    card.className = 'card position-relative';

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn btn-danger btn-sm position-absolute';
                    removeBtn.style.top = '5px';
                    removeBtn.style.right = '5px';
                    removeBtn.style.zIndex = '1';
                    removeBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
                    removeBtn.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        removeExistingImage(String(img.id));
                    };

                    const image = document.createElement('img');
                    image.className = 'card-img-top';
                    image.style.height = '150px';
                    image.style.objectFit = 'cover';
                    image.src = img.src;

                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body p-2';
                    const label = document.createElement('small');
                    label.className = 'text-muted';
                    label.textContent = 'Existing Image';
                    cardBody.appendChild(label);

                    card.appendChild(image);
                    card.appendChild(cardBody);
                    card.appendChild(removeBtn);
                    col.appendChild(card);
                    previewContainer.appendChild(col);
                }
            });

            // Render new images
            selectedFilesList.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const col = document.createElement('div');
                    col.className = 'col-md-3';

                    const card = document.createElement('div');
                    card.className = 'card position-relative';

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn btn-danger btn-sm position-absolute';
                    removeBtn.style.top = '5px';
                    removeBtn.style.right = '5px';
                    removeBtn.style.zIndex = '1';
                    removeBtn.innerHTML = '<i class=\'bi bi-x-lg\'></i>';
                    removeBtn.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        removeImage(index);
                    };

                    const img = document.createElement('img');
                    img.className = 'card-img-top';
                    img.style.height = '150px';
                    img.style.objectFit = 'cover';
                    img.src = e.target.result;

                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body p-2';
                    const fileName = document.createElement('small');
                    fileName.className = 'text-muted';
                    fileName.textContent = file.name;
                    cardBody.appendChild(fileName);

                    card.appendChild(img);
                    card.appendChild(cardBody);
                    card.appendChild(removeBtn);
                    col.appendChild(card);
                    previewContainer.appendChild(col);
                };
                reader.readAsDataURL(file);
            });

            updateFileInput();
        }

        function removeExistingImage(imageId) {
            removedImages.add(String(imageId));
            previewImages({ files: selectedFilesList });
            // Add hidden input to track removed images
            const form = document.querySelector('form');
            const existingInput = form.querySelector(`input[name=\"removedImages\"][value=\"${imageId}\"]`);
            if (!existingInput) {
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'removedImages';
                hiddenInput.value = imageId;
                form.appendChild(hiddenInput);
            }
        }

        function removeImage(index) {
            selectedFilesList.splice(index, 1);
            previewImages({ files: selectedFilesList });
        }

        function updateFileInput() {
            const fileInput = document.getElementById('images');
            const dt = new DataTransfer();
            selectedFilesList.forEach(file => {
                dt.items.add(file);
            });
            fileInput.files = dt.files;
        }
    </script>
</body>
</html>
