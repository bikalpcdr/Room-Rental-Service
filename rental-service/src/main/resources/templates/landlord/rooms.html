<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Rental Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
        }
        .sidebar .nav-link:hover {
            color: #fff;
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .logout-form {
            display: inline;
        }
        .logout-button {
            background: none;
            border: none;
            color: rgba(255,255,255,.75);
            padding: 0;
            margin: 0;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .logout-button:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">Landlord Dashboard</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/landlord/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#" th:href="@{/landlord/rooms}">
                                <i class="bi bi-house-door me-2"></i>
                                Rooms
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/landlord/bookings}">
                                <i class="bi bi-calendar-check me-2"></i>
                                Bookings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/landlord/profile}">
                                <i class="bi bi-person me-2"></i>
                                Profile
                            </a>
                        </li>
                        <li class="nav-item">
                            <form class="logout-form" th:action="@{/auth/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="nav-link logout-button">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Room Management</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="#" th:href="@{/landlord/rooms/create}" class="btn btn-sm btn-primary">
                            <i class="bi bi-plus-circle me-1"></i>Add New Room
                        </a>
                    </div>
                </div>

                <!-- Rooms Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Type</th>
                                        <th>Price</th>
                                        <th>Rooms</th>
                                        <th>Capacity</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="room : ${rooms}">
                                        <td th:text="${room.title}">Room Title</td>
                                        <td>
                                            <span class="badge bg-info" th:text="${room.roomType}">Type</span>
                                        </td>
                                        <td th:text="${'$' + #numbers.formatDecimal(room.pricePerMonth, 1, 2)}">$0.00</td>
                                        <td th:text="${room.numberOfRooms}">0</td>
                                        <td th:text="${room.capacity}">0</td>
                                        <td>
                                            <span class="badge" th:classappend="${room.available ? 'bg-success' : 'bg-danger'}"
                                                  th:text="${room.available ? 'Available' : 'Unavailable'}">
                                                Status
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-group">
                                                <a th:href="@{/landlord/rooms/{id}/edit(id=${room.id})}" 
                                                   class="btn btn-sm btn-primary">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <form th:action="@{/landlord/rooms/{id}/delete(id=${room.id})}" 
                                                      method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                    <button type="submit" class="btn btn-sm btn-danger"
                                                            onclick="return confirm('Are you sure you want to delete this room?')">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
