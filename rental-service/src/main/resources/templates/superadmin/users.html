<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - SuperAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
        }
        .sidebar .nav-link:hover {
            color: white;
        }
        .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255,255,255,.1);
        }
        .main-content {
            padding: 20px;
        }
        .logout-form {
            display: inline;
        }
        .logout-button {
            background: none;
            border: none;
            color: rgba(255,255,255,.75);
            padding: 0;
            margin: 0;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .logout-button:hover {
            color: white;
        }
        .user-actions {
            white-space: nowrap;
        }
        .role-badge {
            font-size: 0.8rem;
            padding: 0.35em 0.65em;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4>SuperAdmin Panel</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/superadmin/dashboard}">
                                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#" th:href="@{/superadmin/users}">
                                <i class="fas fa-users me-2"></i>Users Management
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/superadmin/rooms}">
                                <i class="fas fa-building me-2"></i>Rooms Management
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/superadmin/bookings}">
                                <i class="fas fa-calendar-check me-2"></i>Bookings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/superadmin/payments}">
                                <i class="fas fa-money-bill-wave me-2"></i>Payments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" th:href="@{/superadmin/settings}">
                                <i class="fas fa-cog me-2"></i>Settings
                            </a>
                        </li>
                        <li class="nav-item">
                            <form class="logout-form" th:action="@{/auth/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="nav-link logout-button">
                                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">User Management</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="#" th:href="@{/superadmin/users/create}" class="btn btn-primary">
                            <i class="fas fa-user-plus me-2"></i>Add New User
                        </a>
                    </div>
                </div>

                <!-- Search and Filter -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/superadmin/users}" method="get" class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" name="search" th:value="${param.search}" placeholder="Search by name or email">
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" name="role">
                                    <option value="">All Roles</option>
                                    <option th:each="role : ${T(com.bikalp.rentalservice.enums.UserRole).values()}"
                                            th:value="${role}"
                                            th:text="${role}"
                                            th:selected="${param.role != null and param.role[0] == role}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" name="status">
                                    <option value="">All Status</option>
                                    <option value="true" th:selected="${param.status != null and param.status[0] == 'true'}">Active</option>
                                    <option value="false" th:selected="${param.status != null and param.status[0] == 'false'}">Inactive</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-search me-2"></i>Search
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Users Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Full Name</th>
                                        <th>Phone</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}">1</td>
                                        <td th:text="${user.username}">username</td>
                                        <td th:text="${user.email}">email@example.com</td>
                                        <td th:text="${user.fullName}">Full Name</td>
                                        <td th:text="${user.phoneNumber}">+1234567890</td>
                                        <td>
                                            <span class="badge role-badge" 
                                                  th:classappend="${user.role == 'SUPER_ADMIN' ? 'bg-danger' : 
                                                                  (user.role == 'ADMIN' ? 'bg-warning' : 
                                                                  (user.role == 'LANDLORD' ? 'bg-info' : 'bg-success'))}">
                                                <span th:text="${user.role}">Role</span>
                                            </span>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-danger'}">
                                                <span th:text="${user.enabled ? 'Active' : 'Inactive'}">Status</span>
                                            </span>
                                        </td>
                                        <td class="user-actions">
                                            <a th:href="@{/superadmin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-warning">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{/superadmin/users/{id}/delete(id=${user.id})}" method="post" style="display: inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this user?')">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                            <form th:action="@{/superadmin/users/{id}/toggle-status(id=${user.id})}" method="post" style="display: inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm" 
                                                        th:classappend="${user.enabled ? 'btn-danger' : 'btn-success'}"
                                                        th:text="${user.enabled ? 'Deactivate' : 'Activate'}">
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <nav aria-label="Page navigation" class="mt-4" th:if="${totalPages > 1}">
                            <ul class="pagination justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 1 ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/superadmin/users(page=${currentPage - 1}, size=${pageSize}, search=${param.search}, role=${param.role}, status=${param.status})}">Previous</a>
                                </li>
                                <li class="page-item" th:each="page : ${#numbers.sequence(1, totalPages)}"
                                    th:classappend="${page == currentPage ? 'active' : ''}">
                                    <a class="page-link" th:href="@{/superadmin/users(page=${page}, size=${pageSize}, search=${param.search}, role=${param.role}, status=${param.status})}"
                                       th:text="${page}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages ? 'disabled' : ''}">
                                    <a class="page-link" th:href="@{/superadmin/users(page=${currentPage + 1}, size=${pageSize}, search=${param.search}, role=${param.role}, status=${param.status})}">Next</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
