<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Rental Service</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/admins">Admins</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/landlord/landlords">Landlords</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 th:text="${admin.id == null ? 'Create Admin' : 'Edit Admin'}"></h2>
        
        <form th:action="@{${admin.id == null ? '/admin/admins/create' : '/admin/admins/' + admin.id + '/edit'}}" 
              method="post" class="mt-4">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" 
                       th:value="${admin.username}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('username')}" 
                     th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" 
                       th:value="${admin.email}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" 
                     th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" 
                       th:value="${admin.password}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('password')}" 
                     th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" name="fullName" 
                       th:value="${admin.fullName}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" 
                     th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label for="phoneNumber" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" 
                       th:value="${admin.phoneNumber}">
                <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" 
                     th:errors="*{phoneNumber}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/admins" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
