<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rental Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo {
            font-size: 2.5rem;
            color: #0d6efd;
            margin-bottom: 20px;
        }
        .form-floating {
            margin-bottom: 15px;
        }
        .btn-auth {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
        }
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        .auth-links a {
            color: #0d6efd;
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-home"></i>
                </div>
                <h2>Welcome Back</h2>
                <p class="text-muted">Please login to your account</p>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Success Message -->
            <div th:if="${success}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/auth/login}" method="post" th:object="${loginRequest}">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="emailOrUsername" name="emailOrUsername" 
                           th:field="*{emailOrUsername}" placeholder="Email or username" required>
                    <label for="emailOrUsername">Email or username</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('emailOrUsername')}" 
                         th:errors="*{emailOrUsername}"></div>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" 
                           th:field="*{password}" placeholder="Password" required>
                    <label for="password">Password</label>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" 
                         th:errors="*{password}"></div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-auth">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="auth-links">
                <a th:href="@{/auth/forgot-password}">Forgot Password?</a>
                <p class="mt-3">
                    Don't have an account? <a th:href="@{/auth/register}">Register</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
